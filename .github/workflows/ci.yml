name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build the committed frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify packaged assets match their source
        run: git diff --exit-code -- src/tradingagents/web

  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.13.5"
          uv sync --frozen --extra dev --python python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check runtime lock export
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock --quiet
          git diff --exit-code -- requirements.lock
      - name: Run test suite
        run: pytest -q
      - name: Check documentation
        run: python scripts/check_docs.py

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --require-hashes -r requirements.lock
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          cd /tmp
          /tmp/wheel-smoke/bin/python -I -c "import importlib.resources as r, tradingagents, cli.main; from tradingagents.application.securities import catalog, security; assert (r.files('cli') / 'static' / 'welcome.txt').is_file(); assert (r.files('tradingagents') / 'assets' / 'tauric-logo.svg').is_file(); assert all((r.files('tradingagents') / 'web' / name).is_file() for name in ('index.html', 'app.js', 'style.css')); assert len(catalog()[1]) == 21271; assert security('NVDA')['quote_currency'] == 'USD'; assert security('600519.SS')['quote_currency'] == 'CNY'; print('clean-install import, frontend and stock catalog OK')"
          /tmp/wheel-smoke/bin/tradingagents --help

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.17.2"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .
